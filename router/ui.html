<style>
:root {
  --paper: #f2f5f8; --card: #ffffff; --ink: #16212d; --muted: #5b6b7c;
  --line: #d9e1e9; --accent: #2456e6; --accent-ink: #ffffff;
  --ok: #1d7f43; --bad: #b3261e;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #0d1218; --card: #151d27; --ink: #e7edf4; --muted: #93a3b5;
    --line: #26313e; --accent: #7d9bff; --accent-ink: #0d1218;
    --ok: #5fce8a; --bad: #ff8a7a;
    color-scheme: dark;
  }
}
body {
  background: var(--paper); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  margin: 0 auto; max-width: 920px;
  padding: 28px max(16px, env(safe-area-inset-left, 0px)) 64px
    max(16px, env(safe-area-inset-right, 0px));
}
header { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
header svg { width: 34px; height: 34px; }
header h1 { font-size: 24px; margin: 0; letter-spacing: -0.01em; }
.pill { font-family: ui-monospace, monospace; font-size: 12px; border: 1px solid var(--line);
  border-radius: 999px; padding: 4px 12px; color: var(--muted); margin-left: auto; }
.pill.on { color: var(--ok); border-color: var(--ok); }
.sub { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; min-width: 0; }
.card.full { grid-column: 1 / -1; }
.card h2 { font-size: 15px; margin: 0 0 12px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
.tile .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; }
.tile .v { font-size: 17px; margin-top: 2px; }
.mono { font-family: ui-monospace, monospace; }
.row { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
label { font-size: 13px; color: var(--muted); display: block; margin-top: 10px; }
input[type=text], input[type=password] {
  font: inherit; font-size: 14px; color: var(--ink);
  background: var(--paper); border: 1px solid var(--line); border-radius: 8px;
  padding: 7px 10px; width: 100%; box-sizing: border-box; margin-top: 4px;
}
button { font: inherit; font-size: 13px; font-weight: 600; border: 1px solid var(--line);
  background: var(--card); color: var(--ink); border-radius: 8px; padding: 7px 13px; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button:disabled { opacity: 0.5; cursor: default; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
td, th { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
.scroll { overflow-x: auto; }
.log { background: var(--paper); border-radius: 8px; padding: 10px 12px;
  font-family: ui-monospace, monospace; font-size: 12px; line-height: 1.65;
  white-space: pre-wrap; color: var(--muted); max-height: 220px; overflow-y: auto; }
.hint { font-size: 12.5px; color: var(--muted); margin: 8px 0 0; }
.err { color: var(--bad); font-size: 13px; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  background: var(--ink); color: var(--paper); font-size: 13px;
  padding: 9px 16px; border-radius: 999px; display: none; }
</style>
</head>
<body>
<header>
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.08 13.21C20.19 13.35 20.57 13.75 20.77 14.03C20.97 14.32 21.15 14.61 21.3 14.9C21.45 15.19 21.58 15.49 21.67 15.79C21.76 16.08 21.83 16.38 21.87 16.67C21.9 16.96 21.91 17.25 21.89 17.53C21.87 17.81 21.82 18.08 21.74 18.34C21.66 18.6 21.56 18.85 21.42 19.08C21.29 19.32 21.14 19.54 20.96 19.74C20.78 19.94 20.57 20.12 20.34 20.29C20.12 20.45 19.87 20.59 19.6 20.71C19.34 20.83 19.05 20.93 18.75 21C18.45 21.07 18.14 21.12 17.81 21.15C17.49 21.17 17.15 21.16 16.8 21.13C16.46 21.1 16.1 21.05 15.74 20.96C15.39 20.88 15.03 20.77 14.67 20.64C14.31 20.5 13.94 20.34 13.59 20.15C13.23 19.96 12.88 19.75 12.54 19.51C12.19 19.28 11.85 19.02 11.53 18.74C11.2 18.46 10.89 18.15 10.59 17.83C10.29 17.51 10 17.17 9.74 16.82C9.47 16.46 9.21 16.08 8.99 15.71C8.76 15.34 8.49 14.78 8.39 14.6M7.54 6.94C7.6 6.78 7.77 6.25 7.91 5.93C8.05 5.61 8.21 5.31 8.39 5.04C8.57 4.76 8.77 4.5 8.97 4.28C9.18 4.05 9.41 3.84 9.64 3.67C9.87 3.49 10.12 3.34 10.37 3.22C10.63 3.1 10.89 3 11.15 2.94C11.41 2.88 11.69 2.84 11.95 2.84C12.22 2.84 12.49 2.86 12.75 2.92C13.02 2.98 13.28 3.06 13.54 3.18C13.79 3.29 14.04 3.43 14.28 3.6C14.51 3.77 14.74 3.97 14.95 4.2C15.16 4.42 15.36 4.67 15.55 4.94C15.73 5.21 15.89 5.51 16.04 5.82C16.19 6.13 16.32 6.47 16.42 6.82C16.53 7.17 16.61 7.54 16.68 7.92C16.74 8.3 16.78 8.69 16.79 9.09C16.81 9.49 16.8 9.91 16.77 10.32C16.74 10.74 16.68 11.16 16.6 11.58C16.52 12.01 16.42 12.43 16.29 12.85C16.16 13.27 16.01 13.69 15.84 14.1C15.66 14.5 15.46 14.92 15.25 15.3C15.04 15.68 14.7 16.19 14.59 16.37M8.38 20.93C8.2 20.97 7.67 21.09 7.32 21.12C6.98 21.16 6.63 21.17 6.31 21.15C5.98 21.14 5.66 21.09 5.35 21.03C5.05 20.96 4.76 20.87 4.49 20.75C4.22 20.64 3.97 20.5 3.74 20.34C3.51 20.19 3.3 20.01 3.11 19.81C2.92 19.61 2.76 19.39 2.62 19.17C2.49 18.94 2.37 18.69 2.29 18.43C2.21 18.17 2.15 17.9 2.12 17.63C2.09 17.35 2.09 17.06 2.12 16.77C2.15 16.48 2.21 16.18 2.3 15.89C2.38 15.6 2.5 15.3 2.64 15C2.79 14.71 2.96 14.42 3.16 14.13C3.36 13.85   <h1>mlaude</h1>
  <span class="pill" id="up">…</span>
</header>
<p class="sub">Local router control — keys, connections, models, logs. Key changes need a router restart.</p>

<div class="grid">
  <div class="card">
    <h2>Status</h2>
    <div class="tiles" id="tiles"></div>
    <div class="row">
      <button id="restart">Restart router</button>
    </div>
  </div>

  <div class="card">
    <h2>Keys</h2>
    <div id="keyrows"></div>
    <p class="hint">Anthropic is an optional override — empty means Claude Code login. Saved keys apply after restart.</p>
  </div>

  <div class="card">
    <h2>Connections</h2>
    <label>OpenCode host<input type="text" id="c-host" autocomplete="off"></label>
    <label>Chat path<input type="text" id="c-path" autocomplete="off"></label>
    <label>Models path<input type="text" id="c-models" autocomplete="off"></label>
    <div class="row"><button id="connsave">Save connections</button></div>
  </div>

  <div class="card">
    <h2>Models <span class="mono" id="mcounts"></span></h2>
    <div class="scroll"><table id="mtable"><tr><th>Model</th><th>Label</th></tr></table></div>
    <div class="row">
      <button class="primary" id="sync">Sync now</button>
      <label style="margin:0"><input type="checkbox" id="prune"> prune stale oc- entries</label>
    </div>
    <p class="hint" id="syncmsg"></p>
  </div>

  <div class="card full">
    <h2>Log</h2>
    <div class="log" id="log">…</div>
    <div class="row"><button id="logrefresh">Refresh</button></div>
  </div>
</div>
<div id="toast"></div>

<script>
"use strict";
function toast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg; t.style.display = "block";
  setTimeout(function () { t.style.display = "none"; }, 2200);
}
async function api(path, opts) {
  var r = await fetch(path, opts);
  var body = await r.json().catch(function () { return {}; });
  if (!r.ok) throw new Error((body.error && body.error.message) || ("HTTP " + r.status));
  return body;
}
var SERVICES = [["meta", "Meta"], ["opencode", "OpenCode"], ["anthropic", "Anthropic override"]];

async function refresh() {
  var s = await api("/api/status");
  var up = document.getElementById("up");
  up.textContent = "router up · :" + s.port;
  up.classList.add("on");
  document.getElementById("tiles").innerHTML =
    [["Meta", s.keys.meta], ["OpenCode", s.keys.opencode],
     ["Anthropic", s.keys.anthropic], ["Models", s.models.muse + s.models.oc + s.models.other],
     ["Last sync", s.last_sync || "never"]].map(function (kv) {
      return '<div class="tile"><div class="k">' + kv[0] + '</div><div class="v mono">' + kv[1] + "</div></div>";
    }).join("");
  var kr = document.getElementById("keyrows");
  kr.innerHTML = "";
  SERVICES.forEach(function (svc) {
    var wrap = document.createElement("div");
    wrap.innerHTML = "<label>" + svc[1] + ' <span class="mono">(' + s.keys[svc[0]] + ")</span>" +
      '<input type="password" autocomplete="new-password" placeholder="paste new key, empty keeps current"></label>';
    var row = document.createElement("div");
    row.className = "row";
    var btn = document.createElement("button");
    btn.textContent = "Save " + svc[1] + " key";
    btn.onclick = async function () {
      var input = wrap.querySelector("input");
      if (!input.value) { toast("empty — kept current"); return; }
      btn.disabled = true;
      try {
        var r = await api("/api/keys", {method: "POST",
          headers: {"content-type": "application/json"},
          body: JSON.stringify({service: svc[0], key: input.value})});
        input.value = "";
        toast("saved " + r.shown + " — restart router to apply");
        refresh();
      } catch (e) { toast("error: " + e.message); }
      btn.disabled = false;
    };
    row.appendChild(btn);
    wrap.appendChild(row);
    kr.appendChild(wrap);
  });
  document.getElementById("c-host").value = s.connections.oc_host;
  document.getElementById("c-path").value = s.connections.oc_path;
  document.getElementById("c-models").value = s.connections.oc_models_path;
  var m = await api("/api/models");
  document.getElementById("mcounts").textContent =
    m.counts.muse + " muse · " + m.counts.oc + " oc · " + m.counts.other + " other";
  document.getElementById("mtable").innerHTML =
    "<tr><th>Model</th><th>Label</th></tr>" + m.entries.map(function (e) {
      return "<tr><td class='mono'>" + e.model + "</td><td>" + (e.label || "") + "</td></tr>";
    }).join("");
  refreshLog();
}
async function refreshLog() {
  try {
    var l = await api("/api/log?lines=40");
    document.getElementById("log").textContent =
      l.lines.length ? l.lines.join("\n") : "(no log yet)";
  } catch (e) { document.getElementById("log").textContent = "error: " + e.message; }
}
document.getElementById("restart").onclick = async function () {
  try { await api("/api/restart", {method: "POST"}); toast("restarting…"); }
  catch (e) { toast("restart sent (connection drops on exec)"); }
  setTimeout(refresh, 3000);
};
document.getElementById("connsave").onclick = async function () {
  try {
    await api("/api/connections", {method: "POST",
      headers: {"content-type": "application/json"},
      body: JSON.stringify({
        oc_host: document.getElementById("c-host").value,
        oc_path: document.getElementById("c-path").value,
        oc_models_path: document.getElementById("c-models").value})});
    toast("connections saved");
  } catch (e) { toast("error: " + e.message); }
};
document.getElementById("sync").onclick = async function () {
  var btn = this; btn.disabled = true;
  try {
    var r = await api("/api/sync", {method: "POST",
      headers: {"content-type": "application/json"},
      body: JSON.stringify({prune: document.getElementById("prune").checked})});
    var d = r.diff;
    document.getElementById("syncmsg").textContent =
      "sync: +" + d.added.length + " ~" + d.updated.length + " −" + d.pruned.length +
      (d.added.concat(d.updated).length ? " (" + d.added.concat(d.updated).join(", ") + ")" : "");
    refresh();
  } catch (e) { toast("error: " + e.message); }
  btn.disabled = false;
};
document.getElementById("logrefresh").onclick = refreshLog;
refresh().catch(function (e) {
  document.getElementById("up").textContent = "unreachable";
});
</script>
</body>
